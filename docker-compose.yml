services:
  # 1. MongoDB Local Database
  mongo:
    image: mongo:7.0
    container_name: job_app_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Redis In-Memory Store & Cache
  redis:
    image: redis:7-alpine
    container_name: job_app_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. n8n Workflow Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: job_app_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n

  # 4. Node.js / Express Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: job_app_server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/JobApplicationTracker}
    depends_on:
      mongo:
        condition: service_started
      n8n:
        condition: service_started
      redis:
        condition: service_healthy

  # 5. Next.js Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: job_app_client
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:
  n8n_data:
